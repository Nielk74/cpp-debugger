[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "debuger"
version = "0.1.0"
description = "Good-looking CLI to debug C/C++ using LLDB/GDB/CDB adapters"
authors = [
  {name = "debuger contributors"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.9.0",
  "rich>=13.0.0",
  "PyYAML>=6.0.0",
]

[project.scripts]
debuger = "debuger.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

